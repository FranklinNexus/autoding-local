name: Planner checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  planner:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Check schedule calculations
        shell: pwsh
        run: ./test.ps1
      - name: Check PIN screen recognition with synthetic fixtures
        shell: pwsh
        run: ./test/Test-PhoneUnlock.ps1
      - name: Check persisted schedule state
        shell: pwsh
        run: ./test/Test-SchedulerState.ps1
      - name: Check attendance observation parsing
        shell: pwsh
        run: ./test/Test-AttendanceScreen.ps1
      - name: Check bounded unlock recovery
        shell: pwsh
        run: ./test/Test-UnlockRecovery.ps1
      - name: Check ADB broadcast reply parsing
        shell: pwsh
        run: ./test/Test-AppBridge.ps1
      - name: Rehearse complete shift without device or attendance writes
        shell: pwsh
        run: ./test/Test-FullDryRun.ps1
