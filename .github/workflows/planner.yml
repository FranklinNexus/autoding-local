name: Planner checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  planner:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Check schedule calculations
        shell: pwsh
        run: ./test.ps1
